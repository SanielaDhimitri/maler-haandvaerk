
name: Java CI with Maven

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maler_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maler_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEPLOYED: "true"
      DB_NAME: maler_ci
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CONNECTION_STR: jdbc:postgresql://localhost:5432/
      EMAIL_TEST_MODE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn -B clean test-compile --file pom.xml

      - name: Start Javalin server
        run: |
          mvn -B dependency:build-classpath -Dmdep.outputFile=classpath.txt
          java -cp "target/classes:$(cat classpath.txt)" app.Main > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Javalin server
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:7072/api/bookings > /dev/null; then
              echo "Javalin server is ready"
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Run Maven tests
        run: mvn -B verify --file pom.xml

      - name: Show server logs if tests fail
        if: failure()
        run: cat server.log || true
